services:
  printpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printpilot-hi
    init: true
    restart: unless-stopped
    ports:
      - "${PRINTPILOT_PORT:-3000}:3000"
    environment:
      SELF_HOSTED: "true"
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-}"
      SELF_HOSTED_USER_EMAIL: "${SELF_HOSTED_USER_EMAIL:-owner@printpilot.local}"
      SELF_HOSTED_USER_NAME: "${SELF_HOSTED_USER_NAME:-Propriétaire PrintPilot}"
      PORT: "3000"
    volumes:
      - printpilot_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  printpilot_data:
